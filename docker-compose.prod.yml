# Production deployment: the published GHCR image, Caddy for HTTPS, and volumes
# holding everything that must survive a container replacement — the SQLite
# database, uploads and backups.
#
#   cp .env.example .env
#   # set AUTH_SECRET, ADMIN_PASSWORD, CRON_SECRET, APP_DOMAIN, ACME_EMAIL,
#   # APP_IMAGE_REPO and APP_IMAGE_TAG; APP_URL is derived from APP_DOMAIN
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Migrations run on start (`prisma migrate deploy`). Run a backup nightly from
# host cron or a systemd timer:
#   docker compose -f docker-compose.prod.yml exec -T app npm run backup
name: trasper

services:
  app:
    # APP_IMAGE_REPO is the repository only, without a tag, for example
    # ghcr.io/<owner>/<repo>. APP_IMAGE_TAG is the release tag without the
    # leading "v", for example 1.2.3. Pin exact versions in production.
    image: "${APP_IMAGE_REPO:?set APP_IMAGE_REPO in .env}:${APP_IMAGE_TAG:?set APP_IMAGE_TAG in .env}"
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "file:/data/app.db"
      UPLOAD_DIR: "/data/uploads"
      BACKUP_DIR: "/backups"
      APP_URL: "https://${APP_DOMAIN:-localhost}"
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -base64 48)}"
      # The seed creates the first admin on a fresh volume. Fail fast instead
      # of shipping the published development default.
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      AI_ALLOW_PRIVATE_BASE_URL: "${AI_ALLOW_PRIVATE_BASE_URL:-0}"
    volumes:
      - app-data:/data
      - app-backups:/backups
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Scheduled maintenance (quotation expiry, pro forma status rollups). The
  # route is guarded by CRON_SECRET and is idempotent.
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      CRON_SECRET: "${CRON_SECRET:?set CRON_SECRET in .env}"
    command:
      - sh
      - -c
      - |
        while true; do
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron || true
          sleep 900
        done
    depends_on:
      app:
        condition: service_healthy

  # Caddy obtains and renews Let's Encrypt certificates automatically.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-localhost}"
      ACME_EMAIL: "${ACME_EMAIL:-admin@example.com}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  app-data:
  app-backups:
  caddy-data:
  caddy-config:
