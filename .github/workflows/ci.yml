# Delivery pipeline (plan §20).
#
# On every push and pull request: install, type check, lint, unit tests, build.
# On main and version tags: also the end-to-end suite, then build and publish
# the Docker image to GitHub Container Registry (GHCR).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- every push: the gate ------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # Node 24 is required: Prisma's SQLite driver adapter needs it.
          node-version: 24
          cache: npm

      - name: Check package version
        run: node scripts/check-version.mjs

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.mjs "$RELEASE_TAG"

      - name: Install
        run: npm ci

      - name: Prepare database
        run: |
          npm run db:generate
          npx prisma migrate deploy
          npm run db:seed
        env:
          DATABASE_URL: "file:./ci.db"
          ADMIN_PASSWORD: "ci-admin-password-123"

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "file:./ci.db"
          AUTH_SECRET: "ci-build-only-9f7b0e4d2a6c8b1f3e5d7c9a0b2d4f6e"
          APP_URL: "https://ci.invalid"

      - name: Backup job runs
        run: npm run backup
        env:
          DATABASE_URL: "file:./ci.db"

  # ---- main and version tags: browser flow, then publish -------------------
  e2e:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare database
        run: |
          npm run db:generate
          npx prisma migrate deploy
          npm run db:seed
          node scripts/create-viewer.mjs
        env:
          DATABASE_URL: "file:./e2e.db"
          ADMIN_PASSWORD: "ci-admin-password-123"
          VIEWER_PASSWORD: "ci-viewer-password-123"

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          DATABASE_URL: "file:./e2e.db"
          AUTH_SECRET: "ci-build-only-9f7b0e4d2a6c8b1f3e5d7c9a0b2d4f6e"
          APP_URL: "http://localhost:3000"
          E2E_ADMIN_PASSWORD: "ci-admin-password-123"
          E2E_VIEWER_PASSWORD: "ci-viewer-password-123"

  # Build the production image and push it to GHCR. The image is only
  # published after the verification and end-to-end jobs pass.
  #
  # Tags: latest + main + sha-<commit> on main; 1.2.3 + 1.2 + latest on
  # v1.2.3 tags. Pull requests never log in or push.
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node scripts/check-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Trasper
            org.opencontainers.image.description=Staff travel quotation and pro forma system
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
